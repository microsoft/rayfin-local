name: rayfin-local-validation-$(Date:yyyyMMdd).$(Rev:r)

trigger: none
pr: none

variables:
  RustVersion: '1.96.0'
  NodeVersion: '22.x'
  Target: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: Permissive

    pool:
      name: 1ES-AppDev
      image: windows-2022
      os: windows

    sdl:
      sourceAnalysisPool:
        name: 1ES-AppDev
        image: windows-2022
        os: windows
      policheck:
        enabled: true

    stages:
      - stage: ValidateWindows
        displayName: Sign and validate Windows binary (no distribution)
        jobs:
          - job: BuildWindows
            displayName: Build and test Windows x64
            timeoutInMinutes: 120
            templateContext:
              outputs:
                # Executables stay on the agent until distribution is approved separately.
                - output: pipelineArtifact
                  displayName: Publish source and binary validation metadata
                  targetPath: $(Build.ArtifactStagingDirectory)/validation
                  artifactName: windows-validation
            steps:
              - checkout: self
                clean: true
                persistCredentials: false

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  if ($env:AGENT_OS -ne 'Windows_NT' -or $env:AGENT_OSARCHITECTURE -ne 'X64') {
                    throw 'This validation job requires a Windows x64 agent.'
                  }
                  if ($env:BUILD_REASON -eq 'PullRequest') {
                    throw 'The official pipeline must be queued manually, not from a pull request.'
                  }
                  $commit = & git rev-parse HEAD
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot determine the checked-out source commit.' }
                  if ($env:BUILD_SOURCEVERSION -notmatch '^[0-9a-fA-F]{40}$' -or
                      $commit -ne $env:BUILD_SOURCEVERSION) {
                    throw 'Checkout does not match Build.SourceVersion; queue the intended commit again.'
                  }
                  $required = @(
                    'ESRP_APP_REGISTRATION_CLIENT_ID', 'ESRP_APP_REGISTRATION_TENANT_ID',
                    'ESRP_CLIENT_ID', 'ESRP_KEY_VAULT_NAME', 'ESRP_SIGN_CERT_NAME'
                  )
                  foreach ($name in $required) {
                    $value = [Environment]::GetEnvironmentVariable($name)
                    if ([string]::IsNullOrWhiteSpace($value) -or $value.StartsWith('$(')) {
                      throw "Configure the pipeline's $name ESRP setting before queueing signing."
                    }
                  }
                displayName: Verify agent and exact source commit
                env:
                  ESRP_APP_REGISTRATION_CLIENT_ID: $(EsrpAppRegistrationClientId)
                  ESRP_APP_REGISTRATION_TENANT_ID: $(EsrpAppRegistrationTenantId)
                  ESRP_CLIENT_ID: $(EsrpClientId)
                  ESRP_KEY_VAULT_NAME: $(EsrpKeyVaultName)
                  ESRP_SIGN_CERT_NAME: $(EsrpSignCertName)

              - task: UseNode@1
                displayName: Install Node.js for workspace tests
                inputs:
                  version: $(NodeVersion)

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $configDirectory = Join-Path $env:BUILD_SOURCESDIRECTORY '.cargo'
                  New-Item -ItemType Directory -Force -Path $configDirectory | Out-Null
                  @'
                  [registries.rayfin-official]
                  index = "sparse+https://pkgs.dev.azure.com/powerbi/AppDev/_packaging/rayfin-official/Cargo/index/"
                  credential-provider = "cargo:token"

                  [source.crates-io]
                  replace-with = "rayfin-official"
                  '@ | Set-Content -Encoding utf8 (Join-Path $configDirectory 'config.toml')
                displayName: Configure Cargo to use the internal Rayfin feed

              - task: CargoAuthenticate@0
                displayName: Authenticate Cargo with the pipeline identity
                inputs:
                  configFile: $(Build.SourcesDirectory)/.cargo/config.toml

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $cargoBin = Join-Path $env:USERPROFILE '.cargo/bin'
                  $rustup = Join-Path $cargoBin 'rustup.exe'
                  if (-not (Test-Path $rustup)) {
                    $installer = Join-Path $env:AGENT_TEMPDIRECTORY 'rustup-init.exe'
                    Invoke-WebRequest 'https://win.rustup.rs/x86_64' -OutFile $installer
                    & $installer -y --profile minimal --default-toolchain $env:RUST_VERSION
                    if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
                  }
                  & $rustup toolchain install $env:RUST_VERSION --profile minimal
                  if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
                  & $rustup target add --toolchain $env:RUST_VERSION $env:RUST_TARGET
                  if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed.' }
                  Write-Host "##vso[task.prependpath]$cargoBin"
                displayName: Install pinned Rust toolchain
                env:
                  RUST_VERSION: $(RustVersion)
                  RUST_TARGET: $(Target)

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  & cargo test --workspace --locked --target $env:RUST_TARGET
                  if ($LASTEXITCODE -ne 0) { throw 'Workspace tests failed.' }
                  & cargo build --release --locked -p rayfin-local --target $env:RUST_TARGET
                  if ($LASTEXITCODE -ne 0) { throw 'Release binary build failed.' }
                displayName: Test workspace and build release binary
                env:
                  RUSTUP_TOOLCHAIN: $(RustVersion)
                  RUST_TARGET: $(Target)
                  RUSTFLAGS: -C target-feature=+crt-static

              - task: EsrpCodeSigning@6
                displayName: Sign Windows executable through ESRP
                inputs:
                  ConnectedServiceName: Fabric-ESRP-Secure-AppDev
                  UseMSIAuthentication: true
                  AppRegistrationClientId: $(EsrpAppRegistrationClientId)
                  AppRegistrationTenantId: $(EsrpAppRegistrationTenantId)
                  EsrpClientId: $(EsrpClientId)
                  AuthAKVName: $(EsrpKeyVaultName)
                  AuthSignCertName: $(EsrpSignCertName)
                  FolderPath: $(Build.SourcesDirectory)/target/$(Target)/release
                  Pattern: rayfin-local.exe
                  signConfigType: inlineSignParams
                  inlineOperation: |
                    [
                      {
                        "keyCode": "CP-231522",
                        "operationSetCode": "SigntoolSign",
                        "parameters": [
                          { "parameterName": "OpusName", "parameterValue": "Microsoft" },
                          { "parameterName": "OpusInfo", "parameterValue": "https://www.microsoft.com" },
                          { "parameterName": "FileDigest", "parameterValue": "/fd \"SHA256\"" },
                          { "parameterName": "PageHash", "parameterValue": "/NPH" },
                          {
                            "parameterName": "TimeStamp",
                            "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                          }
                        ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      },
                      {
                        "keyCode": "CP-231522",
                        "operationSetCode": "SigntoolVerify",
                        "parameters": [],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                      }
                    ]
                  SessionTimeout: 90
                  MaxConcurrency: 1
                  MaxRetryAttempts: 5
                  PendingAnalysisWaitTimeoutMinutes: 5

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $binary = Join-Path $env:BUILD_SOURCESDIRECTORY "target/$env:RUST_TARGET/release/rayfin-local.exe"
                  $signature = Get-AuthenticodeSignature -LiteralPath $binary
                  if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
                    throw "Windows executable signature verification failed: $($signature.Status)."
                  }
                  $signer = $signature.SignerCertificate.GetNameInfo(
                    [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false
                  )
                  if ($signer -cne 'Microsoft Corporation') {
                    throw 'Windows executable must be signed by Microsoft Corporation.'
                  }
                  if ($null -eq $signature.TimeStamperCertificate) {
                    throw 'Windows executable must have a trusted timestamp.'
                  }
                  $metadata = & cargo metadata --no-deps --format-version 1 --locked
                  if ($LASTEXITCODE -ne 0) { throw 'Cannot read Cargo package metadata.' }
                  $packages = @(
                    ($metadata | ConvertFrom-Json).packages |
                      Where-Object { $_.name -eq 'rayfin-local' }
                  )
                  if ($packages.Count -ne 1) { throw 'Expected exactly one rayfin-local package.' }
                  $version = $packages[0].version
                  if ($env:BUILD_SOURCEBRANCH.StartsWith('refs/tags/') -and
                      $env:BUILD_SOURCEBRANCH -cne "refs/tags/v$version") {
                    throw "Release tag must be v$version to match Cargo.toml."
                  }
                  $reportedVersion = & $binary --version
                  if ($LASTEXITCODE -ne 0 -or $reportedVersion -cne "rayfin-local $version") {
                    throw "Built binary must report 'rayfin-local $version'."
                  }
                  $output = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'validation'
                  New-Item -ItemType Directory -Force -Path $output | Out-Null
                  [ordered]@{
                    repository = $env:BUILD_REPOSITORY_URI
                    commit = $env:BUILD_SOURCEVERSION
                    ref = $env:BUILD_SOURCEBRANCH
                    buildId = $env:BUILD_BUILDID
                    package = 'rayfin-local'
                    version = $version
                    target = $env:RUST_TARGET
                    rustToolchain = $env:RUSTUP_TOOLCHAIN
                    binarySha256 = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
                    signed = $true
                    signingKeyCode = 'CP-231522'
                    signerSubject = $signature.SignerCertificate.Subject
                    signerThumbprint = $signature.SignerCertificate.Thumbprint
                    distribution = 'none'
                  } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $output 'source.json')
                displayName: Verify signature and binary version and record validation metadata
                env:
                  RUSTUP_TOOLCHAIN: $(RustVersion)
                  RUST_TARGET: $(Target)
